<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prestige Agent — Test Console</title>
<style>
  :root {
    --obsidian:#0F0F10; --panel:#17181A; --panel2:#1E2023; --ivory:#F4F1EA;
    --gold:#C6A15B; --navy:#1D2A38; --muted:#9A968C; --ok:#81B29A; --danger:#E07A5F;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Sarabun","Noto Sans Thai",-apple-system,sans-serif; background:var(--obsidian); color:var(--ivory); line-height:1.55; height:100dvh; }
  .app { max-width:560px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; background:linear-gradient(180deg,var(--navy),var(--obsidian) 34%); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; background:rgba(15,15,16,.92); border-bottom:1px solid rgba(198,161,91,.25); }
  .top h1 { font-size:15px; } .top p { font-size:11px; color:var(--muted); }
  .actions { display:flex; gap:8px; }
  .btn { background:var(--panel2); color:var(--ivory); border:1px solid rgba(198,161,91,.35); border-radius:9px; padding:7px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { border-color:var(--gold); } .btn.primary { background:var(--gold); color:#0F0F10; border:none; }
  .bar { display:flex; align-items:center; gap:7px; padding:7px 16px; font-size:11.5px; background:var(--panel); border-bottom:1px solid rgba(198,161,91,.18); flex-wrap:wrap; }
  .bar .lbl { color:var(--muted); } .bar .val { color:var(--gold); font-weight:700; }
  .chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:86%; padding:10px 14px; border-radius:14px; font-size:14.5px; white-space:pre-wrap; word-break:break-word; animation:pop .22s ease-out; }
  @keyframes pop { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .msg.user { align-self:flex-end; background:var(--gold); color:#0F0F10; font-weight:500; border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--panel2); border:1px solid rgba(198,161,91,.22); border-bottom-left-radius:4px; }
  .msg.meta { align-self:center; background:transparent; border:1px dashed rgba(154,150,140,.4); color:var(--muted); font-size:11.5px; text-align:center; border-radius:999px; padding:5px 14px; max-width:95%; }
  .msg.meta strong { color:var(--gold); }
  .msg.err { align-self:center; background:rgba(224,122,95,.14); border:1px solid rgba(224,122,95,.45); color:var(--danger); font-size:12.5px; border-radius:10px; }
  .fb { align-self:flex-start; display:flex; gap:6px; align-items:center; margin-top:-4px; padding-left:6px; }
  .fb button { background:var(--panel2); color:var(--ivory); border:1px solid rgba(154,150,140,.35); border-radius:8px; padding:3px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  .fb button:hover { border-color:var(--gold); }
  .fb button.on { background:var(--gold); color:#0F0F10; border-color:var(--gold); }
  .fb button:disabled { opacity:.45; cursor:default; }
  .fb .fbsent { font-size:11px; color:var(--ok); }
  .fbcomment { align-self:flex-start; display:flex; gap:6px; padding:0 6px 6px; width:100%; }
  .fbcomment input { flex:1; background:var(--obsidian); border:1px solid rgba(154,150,140,.35); border-radius:8px; padding:7px 10px; color:var(--ivory); font-size:12.5px; font-family:inherit; outline:none; }
  .fbcomment button { background:var(--panel2); border:1px solid rgba(198,161,91,.4); color:var(--gold); border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  .typing { display:inline-flex; gap:4px; align-items:center; padding:4px 2px; }
  .typing span { width:7px; height:7px; border-radius:50%; background:var(--gold); animation:blink 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  .composer { display:flex; gap:8px; padding:10px 16px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid rgba(198,161,91,.18); }
  .composer input { flex:1; background:var(--obsidian); border:1px solid rgba(154,150,140,.35); border-radius:999px; padding:11px 16px; color:var(--ivory); font-size:14.5px; font-family:inherit; outline:none; }
  .composer input:focus { border-color:var(--gold); }
  .composer button { width:44px; height:44px; border-radius:50%; border:none; background:var(--gold); color:#0F0F10; font-size:17px; cursor:pointer; }
  .foot { padding:6px 16px calc(8px + env(safe-area-inset-bottom)); background:var(--obsidian); border-top:1px solid rgba(154,150,140,.15); font-size:10.5px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>Prestige Agent — Test Console</h1>
      <p>เชื่อม FastAPI backend จริง · AI: <span id="modelName">—</span></p>
    </div>
    <div class="actions">
      <input id="tester" placeholder="ชื่อผู้ทดสอบ" maxlength="50" aria-label="ชื่อผู้ทดสอบ" style="width:110px;background:var(--obsidian);border:1px solid rgba(154,150,140,.35);border-radius:8px;padding:6px 10px;color:var(--ivory);font-size:12px;font-family:inherit;outline:none;">
      <button class="btn primary" id="newChat">＋ New chat</button>
    </div>
  </div>
  <div class="bar">
    <span class="lbl">Chat ID:</span><span class="val" id="chatId">—</span>
    <span class="lbl">State:</span><span class="val" id="state">new</span>
    <span class="lbl">Action:</span><span class="val" id="action">—</span>
  </div>
  <main class="chat" id="chat" role="log"></main>
  <form class="composer" id="composer">
    <input id="input" maxlength="500" autocomplete="off" placeholder="พิมพ์ข้อความ..." aria-label="พิมพ์ข้อความ">
    <button type="submit" aria-label="ส่ง">➤</button>
  </form>
  <div class="foot">⚠️ ข้อมูลที่ส่งจะถูกบันทึกในฐานข้อมูลทดสอบของ backend · สถานะจริงจาก state machine</div>
</div>

<script>
"use strict";
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const composer = document.getElementById("composer");
const chatIdEl = document.getElementById("chatId");
const stateEl = document.getElementById("state");
const actionEl = document.getElementById("action");
const newChatBtn = document.getElementById("newChat");
const testerEl = document.getElementById("tester");

let chatId = null;
let busy = false;
const API_KEY = null; // injected server-side at /test

function uuid() {
  return "test-" + crypto.randomUUID().slice(0, 8);
}

function addBubble(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addMeta(html) {
  const div = document.createElement("div");
  div.className = "msg meta";
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send(text) {
  if (!chatId || busy) return;
  busy = true;
  addBubble(text, "user");
  const typing = addTyping();
  try {
    const res = await fetch("/internal/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
      body: JSON.stringify({ external_id: chatId, message: text }),
    });
    const data = await res.json();
    typing.remove();
    if (!res.ok) {
      addBubble("HTTP " + res.status + ": " + (data.detail || JSON.stringify(data)), "err");
      return;
    }
    const botDiv = addBubble(data.reply, "bot");
    if (data.reply_message_id) {
      botDiv.dataset.messageId = data.reply_message_id;
      renderFeedback(botDiv, data.reply_message_id);
    }
    stateEl.textContent = data.next_state;
    actionEl.textContent = data.next_action + (data.rationale ? " · " + data.rationale : "");
  } catch (e) {
    typing.remove();
    addBubble("Error: " + e.message, "err");
  } finally {
    busy = false;
  }
}

/* ---------------- Feedback capture ---------------- */
function renderFeedback(botDiv, messageId) {
  const wrap = document.createElement("div");
  wrap.className = "fb";
  const good = document.createElement("button");
  good.textContent = "👍 ดี";
  const bad = document.createElement("button");
  bad.textContent = "👎 แก้ไข";
  wrap.append(good, bad);
  botDiv.after(wrap);

  const apply = (rating, comment) => {
    good.disabled = bad.disabled = true;
    const ok = document.createElement("span");
    ok.className = "fbsent";
    ok.textContent = "บันทึกแล้ว ✅";
    wrap.appendChild(ok);
    fetch("/internal/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
      body: JSON.stringify({
        message_id: messageId,
        rating,
        comment: comment || null,
        tester: testerEl.value.trim() || null,
      }),
    }).catch(() => {
      ok.textContent = "ส่งไม่สำเร็จ ⚠️";
    });
  };

  good.addEventListener("click", () => {
    good.classList.add("on");
    apply("good", "");
  });
  bad.addEventListener("click", () => {
    bad.classList.add("on");
    const row = document.createElement("div");
    row.className = "fbcomment";
    const input = document.createElement("input");
    input.placeholder = "ควรปรับยังไง? (ไม่บังคับ)";
    const submit = document.createElement("button");
    submit.textContent = "ส่ง";
    row.append(input, submit);
    wrap.after(row);
    input.focus();
    submit.addEventListener("click", () => {
      apply("needs_work", input.value.trim());
      row.remove();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        apply("needs_work", input.value.trim());
        row.remove();
      }
    });
  });
}

function newChat() {
  chatId = uuid();
  chatIdEl.textContent = chatId;
  stateEl.textContent = "new";
  actionEl.textContent = "—";
  chat.innerHTML = "";
  addMeta("🆕 <strong>New chat:</strong> " + chatId + " — สถานะเริ่มต้น <strong>NEW</strong>");
  send("สวัสดีครับ");
}

composer.addEventListener("submit", (e) => {
  e.preventDefault();
  const v = input.value.trim();
  if (!v) return;
  send(v);
  input.value = "";
  input.focus();
});

newChatBtn.addEventListener("click", newChat);

// Auto boot with a fresh chat
newChat();
</script>
</body>
</html>
