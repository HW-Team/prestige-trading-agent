[project]
name = "prestige-trading-agent"
version = "0.1.0"
description = "Prestige Trading Messenger-to-LINE funnel agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pydantic-ai>=1.0",
  "sqlalchemy[asyncio]>=2.0.41",
  "aiosqlite>=0.21",
  "asyncpg>=0.30",
  "alembic>=1.16",
  "httpx>=0.28",
  "stripe>=12.0",
  "structlog>=25.4",
  "mem0ai>=2.0.19",
  "chromadb>=1.5",
  "fastembed>=0.7",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
  "mypy>=1.16",
]

[project.scripts]
prestige-agent = "prestige_trading_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prestige_trading_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# knowledge.py holds verbatim approved Thai copy (long lines + en-dashes are
# part of the source doc — not code style).
"src/prestige_trading_agent/knowledge.py" = ["E501", "RUF001", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "skip"
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false
files = ["src"]
